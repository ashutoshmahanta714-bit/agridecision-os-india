project:
  name: AgriDecision OS India
  random_seed: 42

data:
  resource_id: 9ef84268-d588-465a-a308-a864a43d0070
  api_base_url: https://api.data.gov.in/resource
  commodity: Onion
  page_size: 500
  request_delay_seconds: 1.5
  max_pages: 2000
  raw_path: data/raw/mandi_prices.csv
  processed_path: data/processed/mandi_prices.csv

forecast:
  horizon_days: 7
  shock_threshold: 0.15
  test_fraction: 0.20
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 14, 28]

model:
  regression:
    max_iter: 300
    learning_rate: 0.06
    max_leaf_nodes: 31
  classification:
    max_iter: 1000
    class_weight: balanced

monitoring:
  psi_warning: 0.10
  psi_alert: 0.25

