[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agridecision-os"
version = "0.1.0"
description = "Reproducible agricultural price forecasting and decision-intelligence platform for Indian mandis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ashutosh Mahanta"}]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
analysis = [
  "jupyter>=1.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
]
app = [
  "fastapi>=0.115",
  "plotly>=5.20",
  "streamlit>=1.40",
  "uvicorn[standard]>=0.30",
]
dev = [
  "httpx2>=2.12",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
agridecision = "agridecision.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
