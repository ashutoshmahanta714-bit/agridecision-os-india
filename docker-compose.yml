services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      AGRIDECISION_ARTIFACT_DIR: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts:ro

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./artifacts:/app/artifacts:ro

